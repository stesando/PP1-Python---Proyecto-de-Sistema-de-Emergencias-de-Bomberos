<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Bomberos</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <h1>Sistema de Emergencias</h1>

  <section class="formulario">
    <h2>Nueva Emergencia</h2>

    <form id="formEmergencia">

      <input
        type="text"
        id="caller_name"
        placeholder="Nombre del solicitante"
        required
      >

      <input
        type="text"
        id="location"
        placeholder="Ubicación"
        required
      >

      <input
        type="text"
        id="emergency_type"
        placeholder="Tipo de emergencia"
        required
      >

      <input
        type="text"
        id="status"
        placeholder="Estado"
        required
      >

      <input
        type="text"
        id="unit"
        placeholder="Unidad"
        required
      >

      <button type="submit">
        Agregar Emergencia
      </button>

    </form>
  </section>


  <section>
    <h2>Emergencias</h2>

    <div id="contenedorEmergencias"></div>
  </section>


  <section>
    <h2>Favoritos</h2>

    <div id="contenedorFavoritos"></div>
  </section>


  <script type="module" src="../js/main.js"></script>

</body>
</html>
